name: QA

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: QA in Docker (committed HEAD, same Dockerfile as local)
        run: bash scripts/qa.sh

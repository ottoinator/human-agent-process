name: QA

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: QA in Docker (committed HEAD, same Dockerfile as local)
        run: bash scripts/qa.sh
